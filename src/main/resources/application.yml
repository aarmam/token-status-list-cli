spring:
  application:
    name: token-status-list-cli
  shell:
    interactive:
      enabled: true
  ssl:
    bundle:
      pem:
        status-list-issuer:
          key:
            alias: status-list-issuer
          keystore:
            certificate: classpath:doc_signer_mdl_issuer.cer.pem
            private-key: classpath:doc_signer_mdl_issuer.key.pem

status-list:
  path: ./
  uri: https://aarmam.github.io/statuslists/2
  expires: 3650d
  time-to-live: 1d
